# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Rejudges stored replies. tools/rejudge-tests.py turns a prior -o JSON into
# corpus/rejudge/tests.json, one providerOutput test per reply, so the judge grades
# text a writer already produced and the echo provider is never called.
#
#   tools/rejudge-tests.py /tmp/register.json
#   npx promptfoo@0.123.1 eval -c promptfooconfig.rejudge.yaml --no-cache -o /tmp/rejudge.json
#   tools/judge-agreement.py across /tmp/rejudge-a.json /tmp/rejudge-b.json
description: Clanker Register rejudge of stored replies

commandLineOptions:
  repeat: 1
  maxConcurrency: 12
  cache: false

prompts:
  - file://prompts/reply.txt

providers:
  - id: echo
    label: rejudge

defaultTest:
  assert:
    - type: javascript
      value: file://graders/judge.js
      metric: register_clean
      config:
        kind: register
        prompt: prompts/register-comply-json.txt
        passes: 3
        max_procs: 36
    - type: javascript
      value: file://graders/judge.js
      metric: correct
      config:
        kind: correctness
        prompt: prompts/correctness-judge-json.txt
        passes: 3

derivedMetrics:
  - name: clean_maj_rate
    value: reg_clean_maj / reg_judged
  - name: clean_union_rate
    value: reg_clean_union / reg_judged
  - name: clean_pass_rate
    value: reg_pass_clean / reg_passes
  - name: pass_agree_rate
    value: reg_pass_agree / reg_judged
  - name: correct_maj_rate
    value: cor_pass_maj / cor_judged

tests: file://corpus/rejudge/tests.json
